services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: techserv
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend/TechServ.Api
    environment:
      # Inside Docker the database is reached by its service name, not localhost.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=techserv;Username=postgres;Password=postgres"
    ports:
      - "5208:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5208
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db-data:
